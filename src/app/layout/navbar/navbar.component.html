<header class="navbar">
  <div class="nabvar-title-wrapper">
    <div class="btn btn-link btn-sm" role="button" tabindex="0" aria-label="Alternar menú lateral"
      (click)="toggleSidebar()" (keydown.enter)="toggleSidebar()"
      (keydown.space)="toggleSidebar(); $event.preventDefault()">
      <i class="pi" [class]="isSidebarOpen ? 'pi-bars' : 'pi-times'" aria-hidden="true"></i>
    </div>
    <span class="navbar-title">{{ moduleConfig.description }}</span>
  </div>
  <div class="navbar-right">

    <div #cogIcon class="navbar-icon-option" role="button" tabindex="0" aria-label="Configuración"
      (click)="toggleDropdown(cogIcon)" (keydown.enter)="toggleDropdown(cogIcon)"
      (keydown.space)="toggleDropdown(cogIcon); $event.preventDefault()">
      <i class="pi pi-cog" aria-hidden="true"></i>
    </div>

    <div class="navbar-icon-option" role="button" tabindex="0" aria-label="Cerrar sesión" (click)="logout()"
      (keydown.enter)="logout()" (keydown.space)="logout(); $event.preventDefault()">
      <i class="pi pi-sign-out" aria-hidden="true"></i>
    </div>

  </div>

</header>
<app-icon-dropdown #dropdown [options]="cogOptions"></app-icon-dropdown>

<p-dialog [(visible)]="isDisplayChangePassword" header="Cambiar Contraseña" [draggable]="false" [resizable]="true"
  [closable]="false" [modal]="true" [baseZIndex]="10000">

  <app-form-template [form]="changePasswordForm" [colClass]="'col-12'"></app-form-template>

  <ng-template #footer>
    <p-button label="Cancelar" [text]="true" severity="secondary" (click)="closeDialog()" />
    <p-button label="Save" [outlined]="true" severity="primary"
      [disabled]="formComponent?.formGroup?.invalid || disabledButton" (click)="save()" />
  </ng-template>

</p-dialog>
