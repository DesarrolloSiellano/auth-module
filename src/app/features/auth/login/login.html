<p-toast></p-toast>

<div class="container">
  <section class="login-content">
    <p-card>
      <p class="title-card">Inicio de Sesión</p>
      <div class="icon-container">
        <div class="no-image"><i class="pi pi-user"></i></div>
      </div>

      <div class="message">
        @if (showMessageSuccess()) {
        <p-message [life]="2000" severity="success">{{ messageSuccess() }}</p-message>
        }

        @if (showMessageError()) {
        <p-message [life]="5000" severity="error">{{ errorStatus() }} {{ errorMessage() }}</p-message>
        }
      </div>

      <div>
        <app-form-template [form]="loginForm" [colClass]="'col-12'"></app-form-template>
      </div>

      <div class="recovery"><a role="button" tabindex="0" (click)="recoveryPass()" (keydown.enter)="recoveryPass()"
          (keydown.space)="recoveryPass(); $event.preventDefault()">¿Olvidaste tu contraseña?</a></div>

      <ng-template #footer>
        <div class="flex justify-center m-md">
          <p-button severity="primary" [fluid]="true" class="w-full" [outlined]="true" (click)="login()"
            [disabled]="formComponent?.formGroup?.invalid || isSubmitting()">
            Entrar <i class="pi pi-sign-in"></i></p-button>
        </div>
      </ng-template>
    </p-card>
  </section>
</div>
